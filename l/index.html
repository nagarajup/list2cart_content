<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Shared grocery list | List2Cart</title>
<meta property="og:title" content="A grocery list was shared with you">
<meta property="og:description" content="Open it in List2Cart and tick items as you buy them.">
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f6;color:#26332f;font-family:Arial,Helvetica,sans-serif;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
.card{background:#fff;border-radius:14px;box-shadow:0 3px 16px rgba(25,55,48,.08);overflow:hidden}
.head{background:#01AA4F;color:#fff;padding:18px 20px}.head h1{margin:0;font-size:1.35rem}.head p{margin:4px 0 0;opacity:.9;font-size:.92rem}
ul{list-style:none;margin:0;padding:6px 0}li{display:flex;gap:12px;align-items:flex-start;padding:10px 20px;border-bottom:1px solid #eef2f0}
li:last-child{border-bottom:0}.box{flex:none;width:20px;height:20px;border:2px solid #b0b8b4;border-radius:50%;margin-top:2px}
.done .box{background:#01AA4F;border-color:#01AA4F}.done .name{color:#8a9490;text-decoration:line-through}.na .box{border-color:#E65100}.na .name{color:#8a9490}.na .tag{color:#E65100;font-size:.8rem;font-weight:bold}
.meta{display:block;color:#7a8682;font-size:.85rem}
.cta{display:block;margin:20px 0 8px;padding:14px;text-align:center;background:#01AA4F;color:#fff;border-radius:10px;text-decoration:none;font-weight:bold}
.note{text-align:center;color:#687572;font-size:.88rem}.msg{padding:28px 20px;text-align:center;color:#687572}
</style></head><body><main>
<div class="card"><div class="head"><h1 id="title">Shared grocery list</h1><p id="sub">Loading…</p></div>
<ul id="items"></ul></div>
<a class="cta" id="open" href="https://play.google.com/store/apps/details?id=com.aniapps.grocerychecklist">Open in List2Cart</a>
<p class="note">Have the app? Tap the link again from WhatsApp to open it in the app and tick items as you buy.<br>No app yet? The button takes you to Google Play.</p>
</main>
<script>
(function(){
  var SUPABASE_URL="https://esgmxzjhpuumiafgrghm.supabase.co";
  var KEY="sb_publishable_xICDWDvnGw129C8qaAAfWA_ynoIFlt_";
  var m=location.pathname.match(/\/l\/([A-Za-z0-9]{6,32})/);
  var list=document.getElementById("items"),sub=document.getElementById("sub");
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function fail(t){sub.textContent="";list.innerHTML='<li class="msg">'+esc(t)+'</li>'}
  if(!m){fail("This link is not valid.");return}
  // Android: try the app first via intent:// (falls back to Play if not installed).
  if(/Android/i.test(navigator.userAgent)){
    // Opens the app if installed; otherwise Google Play (referrer carries the list code).
    var play="https://play.google.com/store/apps/details?id=com.aniapps.grocerychecklist&referrer="+encodeURIComponent("utm_source=shared_list&list="+m[1]);
    var intentUrl="intent://www.list2cart.in/l/"+m[1]+"#Intent;scheme=https;package=com.aniapps.grocerychecklist;S.browser_fallback_url="+encodeURIComponent(play)+";end";
    document.getElementById("open").href=intentUrl;
    // Try once automatically (not again when the user comes back with Back).
    var tried=false; try{tried=sessionStorage.getItem("l2c_"+m[1])==="1";sessionStorage.setItem("l2c_"+m[1],"1");}catch(e){}
    if(!tried){ setTimeout(function(){ location.href=intentUrl; }, 1200); }
  } else {
    document.getElementById("open").href="https://play.google.com/store/apps/details?id=com.aniapps.grocerychecklist";
    document.getElementById("open").textContent="Get List2Cart on Google Play";
  }
  fetch(SUPABASE_URL+"/rest/v1/rpc/shared_list_preview",{method:"POST",headers:{"apikey":KEY,"Content-Type":"application/json"},body:JSON.stringify({p_share_code:m[1]})})
   .then(function(r){if(!r.ok)throw 0;return r.json()})
   .then(function(d){
     if(!d){fail("This list is no longer shared.");return}
     document.getElementById("title").textContent=d.title||"Grocery list";
     var items=d.items||[],done=items.filter(function(i){return i.is_checked}).length;
     sub.textContent=(d.owner_name||"Someone")+" shared this list · "+done+"/"+items.length+" in cart";
     list.innerHTML=items.map(function(i){
       var meta=[i.quantity,i.note].filter(function(x){return x}).join(" · ");
       return '<li class="'+(i.is_na?"na":(i.is_checked?"done":""))+'"><span class="box"></span><span><span class="name">'+esc(i.name)+'</span>'+(meta?'<span class="meta">'+esc(meta)+'</span>':'')+(i.is_na?'<span class="meta tag">Not available</span>':'')+'</span></li>';
     }).join("")||'<li class="msg">This list is empty.</li>';
   })
   .catch(function(){fail("Couldn't load the list. Please try again.")});
})();
</script></body></html>
